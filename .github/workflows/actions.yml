name: analytics
on:
    push:
        branches: [dev]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'temurin'
                cache: 'maven'

            - name: Build with maven
              run: mvn clean package -DskipTests

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3.11.1

            - name: Log in to Docker Hub
              uses: docker/login-action@v3.5.0
              with:
                username: ${{ secrets.DOCKER_HUB_USERNAME }}
                password: ${{ secrets.DOCKER_CI_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6.18.0
              with:
                context: .
                push: true
                tags: drako02/drako:analytics-latest

            - name: Deploy to VM
              uses: appleboy/ssh-action@v1.2.2
              with:
                host: ${{ secrets.AZURE_VM_HOST }}
                username: ${{ secrets.AZURE_VM_USERNAME }}
                key: ${{ secrets.AZURE_VM_SSH_KEY }}
                port: 22
                script: |
                    echo "${{ secrets.DOCKER_CI_TOKEN }}" | docker login -u ${{ vars.DOCKER_HUB_USERNAME }} --password-stdin
                    # docker pull drako02/drako:analytics-latest
                    # docker stop analytics || true
                    # docker rm analytics || true
                    # docker run -d --name analytics -p 8080:8080 drako02/drako:analytics-latest
                    cd ~/url-shortener-compose
                    docker compose pull
                    docker compose up -d --remove-orphans spring_boot_service
                    